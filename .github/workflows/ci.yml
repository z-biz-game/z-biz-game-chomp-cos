name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rule model, the solver, the book and the shipped campaign are all pure ES modules: no
  # browser, no install step. Two rows are the reason this job exists:
  #   * anchor.test.mjs — the exhaustive P/N table is compared square by square against the
  #     published two-row characterisation (the P-positions are exactly the staircase (k, k-1)
  #     for k = 2..9) and against the single-row outcome vector for widths 1..9, with the
  #     expectations written as literals in test/fixture.mjs;
  #   * library.test.mjs — re-solves every lot in js/data/lots.js from its serialised shape, so
  #     a hand-edited winner, k or states count fails the build instead of shipping.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in js/*.js js/*/*.js server.cjs electron/main.cjs tools/*.mjs test/*.mjs; do node --check "$f"; done
      - name: Suites
        run: for f in test/*.test.mjs; do echo "::group::$f"; node "$f"; echo "::endgroup::"; done
      # The documentation gate, byte for byte the command a contributor runs locally
      # (`npm run doctest`). It re-runs the nine suites itself, so the floor in verify.sh and the
      # numbers printed here are the same measurement.
      - name: Doc numbers
        run: node tools/doctest.mjs
      # The sabotage ledger: twelve knives, one per gate group, each cut written into a throwaway
      # copy of the tree. It must drive the doc gate red AND name the assertion it killed; then the
      # working tree has to be untouched, because the ledger's rc column is committed.
      - name: Sabotage ledger
        run: |
          node tools/sabotage.mjs
          git diff --exit-code || { echo "台账跑完工作树是脏的：某一刀没把它的靶恢复回去"; exit 1; }
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # The shell is only proven by driving a real page with real mouse events: the canvas hit test,
  # the refused-poison-square rule and the save file all live behind `window.chomp`.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 240
        run: bash tools/verify.sh
