name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 拷哪些不写在这里——写在 tools/assemble-site.sh，本地闸与 CI 调同一支脚本。
      # 以前这里是手抄的三行 cp（index.html/css/js），于是页面后来引用的
      # manifest.webmanifest、sw.js、icons/* 全都上不了线：线上 404，而 CI 一路绿，
      # 因为没有任何一步加载过那份产物。服务器、台架、文档、node_modules 仍在 artifact 外面。
      - name: Assemble static site
        run: bash tools/assemble-site.sh _site
      - name: Deploy set gate (checks the very _site about to be uploaded)
        run: node tools/deploy-set.mjs _site
      - name: Every path index.html and the manifest point at really shipped
        run: |
          grep -oE '(href|src)="[^"]+"' index.html | sed -E 's/.*"([^"]+)".*/\1/' \
            | grep -vE '^(data:|http|mailto)' \
            | while read -r p; do
                test -f "_site/${p#./}" || { echo "MISSING in artifact: $p"; exit 1; }
              done
          python3 -c 'import json,os,sys; missing=[i["src"] for i in json.load(open("_site/manifest.webmanifest"))["icons"] if not os.path.isfile(os.path.join("_site", i["src"].lstrip("./")))]; print("\n".join("MISSING icon: "+m for m in missing)); sys.exit(1 if missing else 0)'
          test "$(find _site/assets -name '*.png' -size +1c | wc -l)" -ge 11 || { echo "artifact bitmaps missing or empty"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
